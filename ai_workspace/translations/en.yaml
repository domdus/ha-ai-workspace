configuration:
  cursor_api_key:
    name: Cursor API key
    description: User API key from Cursor Dashboard → Integrations
  model:
    name: Model
    description: Default Cursor model id, for example composer-2.5. The HACS form can override this.
  claude_oauth_token:
    name: Claude Plan token
    description: For Claude SDK agents on your Claude subscription (Pro, Max). Run `claude setup-token` on a computer with Claude Code and paste the token (sk-ant-oat…). It lasts one year. Used before the Anthropic API key when both are set.
  anthropic_api_key:
    name: Anthropic API key
    description: For Claude SDK agents billed as API credits. An API key (sk-ant-api…) from console.anthropic.com → API keys. Optional when every Claude SDK agent has its own credential.
  claude_model:
    name: Claude model
    description: Default model for Claude SDK agents, for example claude-sonnet-5-5. The agent's model in Home Assistant wins.
  runtime_token:
    name: Runtime token
    description: Filled in by the AI Workspace integration. Leave it alone unless you pair the integration by hand.
  hass_url:
    name: Home Assistant URL
    description: How the runtime reaches Home Assistant. Leave it empty; the App uses http://homeassistant:8123.
network:
  8090/TCP: Used by the HACS integration. Leave unpublished on the host.
