name: AI Workspace Runtime
version: "1.6.0"
slug: ai_workspace
description: >-
  Runs Cursor, Claude Agent SDK and OpenAI Codex side by side next to Home Assistant and talks to LAN MCP.
  Install the AI Workspace HACS integration for the sidebar chat.
url: https://github.com/domdus/ha-ai-workspace
image: ghcr.io/domdus/ha-ai-workspace-runtime
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant: "2025.12.0"
ingress: false
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Used by the HACS integration. Leave unpublished on the host.
watchdog: http://[HOST]:[PORT:8090]/api/health
options:
  cursor_api_key: ""
  model: composer-2.5
  runtime_token: ""
# Claude has no fields here: sign in with Claude on the agent in Home Assistant. Docker runtimes
# use CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY / CLAUDE_MODEL.
schema:
  cursor_api_key: password?
  model: str
  runtime_token: password?
  hass_url: url?
