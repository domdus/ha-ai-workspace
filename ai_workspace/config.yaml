name: AI Workspace Runtime
version: "1.3.0b2"
slug: ai_workspace
description: >-
  Runs the Cursor agent next to Home Assistant and talks to LAN MCP.
  Install the AI Workspace HACS integration for the sidebar chat.
url: https://github.com/domdus/ha-ai-workspace
image: ghcr.io/domdus/ha-ai-workspace-runtime
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant: "2025.12.0"
ingress: false
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Used by the HACS integration. Leave unpublished on the host.
watchdog: http://[HOST]:[PORT:8090]/api/health
options:
  cursor_api_key: ""
  model: composer-2.5
  runtime_token: ""
  hass_url: ""
  shorten_mcp_results: true
  change_history: true
schema:
  cursor_api_key: password
  model: str
  runtime_token: password?
  hass_url: url?
  shorten_mcp_results: bool?
  change_history: bool?
