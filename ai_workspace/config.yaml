name: AI Workspace Runtime
version: "1.0.5"
slug: ai_workspace
description: >-
  Runs the Cursor agent next to Home Assistant and talks to LAN MCP.
  Install the AI Workspace HACS integration for the sidebar chat.
url: https://github.com/domdus/ha-ai-workspace
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant: "2024.8.0"
ingress: false
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Used by the HACS integration. Leave unpublished on the host.
watchdog: http://[HOST]:[PORT:8090]/api/health
options:
  cursor_api_key: ""
  model: composer-2.5
schema:
  cursor_api_key: password
  model: str
