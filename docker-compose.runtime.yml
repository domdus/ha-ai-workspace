# AI Workspace Cursor Runtime — same Docker host as Home Assistant.
# This is not a second Home Assistant. Copy this file, paste the key, start it.
#
#   docker compose -f docker-compose.runtime.yml up -d
#   docker compose -f docker-compose.runtime.yml up -d --build   # from this checkout
#
# Image: ghcr.io/domdus/ha-ai-workspace-runtime (linux/amd64 + linux/arm64).
# `build:` stays so you can build from ./ai_workspace with --build.
#
# Host network so 127.0.0.1 MCP on this machine works. HOST 127.0.0.1 keeps 8090 off the LAN.
# Home Assistant → Runtime URL: http://127.0.0.1:8090
# On loopback RUNTIME_TOKEN is optional. With HOST 0.0.0.0 (bridge network, other host)
# it is required: set a long random value here and the same one in
# Cursor agent → Runtime token. Generate one with `openssl rand -hex 32`.
# CURSOR_MODEL is only the fallback when the integration Model field is empty.
# A value in the integration is sent as JSON `model` on each chat, then to AgentOptions.model.

name: ai-workspace-runtime

services:
  cursor-sdk:
    container_name: cursor-sdk
    image: ghcr.io/domdus/ha-ai-workspace-runtime:latest
    build: ./ai_workspace
    network_mode: host
    environment:
      CURSOR_API_KEY: "paste-your-cursor-api-key"
      CURSOR_MODEL: composer-2.5
      RUNTIME_TOKEN: ""
      AUTH_MODE: ingress
      DATA_DIR: /data
      HOST: "127.0.0.1"
      PORT: "8090"
    volumes:
      - ai-workspace-data:/data
    restart: unless-stopped

volumes:
  ai-workspace-data:
