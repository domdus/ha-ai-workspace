# AI Workspace Runtime (Cursor + Claude Agent SDK) — same Docker host as Home Assistant.
# This is not a second Home Assistant. Copy this file, paste the key, start it.
#
#   docker compose -f docker-compose.runtime.yml up -d
#   docker compose -f docker-compose.runtime.yml up -d --build   # from this checkout
#
# Image: ghcr.io/domdus/ha-ai-workspace-runtime (linux/amd64 + linux/arm64).
# `build:` stays so you can build from ./ai_workspace with --build.
#
# Host network so 127.0.0.1 MCP on this machine works. HOST 127.0.0.1 keeps 8090 off the LAN.
# Home Assistant → Runtime URL: http://127.0.0.1:8090
# On loopback RUNTIME_TOKEN is optional. With HOST 0.0.0.0 (bridge network, other host)
# it is required: set a long random value here and the same one in
# Runtime token on the agent form (Cursor or Claude SDK). Generate one with `openssl rand -hex 32`.
# CURSOR_MODEL is only the fallback when the integration Model field is empty.
# A value in the integration is sent as JSON `model` on each chat, then to AgentOptions.model.
# Optional files: WORKSPACE_DIR defaults to /data/workspace (this volume). To bind a host
# project, set WORKSPACE_DIR=/workspace and add   - /path/on/host:/workspace
# Seed AGENTS.md only if missing. Do not mount Home Assistant /config. See README Option B.
# Optional git: GIT_REPO=git@github.com:org/repo.git  GIT_SSH_KEY=/run/secrets/git_ssh
#   mount the private key  - /path/to/id_ed25519:/run/secrets/git_ssh:ro
#   GIT_BRANCH, GIT_USER_NAME, GIT_USER_EMAIL, or GIT_TOKEN (HTTPS PAT) as needed.

name: ai-workspace-runtime

services:
  ai-workspace-runtime:
    container_name: ai-workspace-runtime
    image: ghcr.io/domdus/ha-ai-workspace-runtime:latest
    build: ./ai_workspace
    network_mode: host
    environment:
      CURSOR_API_KEY: "paste-your-cursor-api-key"
      CURSOR_MODEL: composer-2.5
      # Claude Agent SDK (one auth mode; see docs/claude-runtime.md)
      # OPENROUTER_API_KEY: ""
      # CLAUDE_CODE_OAUTH_TOKEN: ""
      # ANTHROPIC_API_KEY: ""
      # CLAUDE_MODEL: claude-sonnet-5-5
      RUNTIME_TOKEN: ""
      AUTH_MODE: ingress
      DATA_DIR: /data
      HOST: "127.0.0.1"
      PORT: "8090"
      HASS_URL: "http://127.0.0.1:8123"
    volumes:
      - ai-workspace-data:/data
    restart: unless-stopped

volumes:
  ai-workspace-data:
