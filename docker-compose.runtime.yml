# AI Workspace Cursor Runtime — same Docker host as Home Assistant.
# This is not a second Home Assistant. Copy this file, replace the key, start it.
#
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/domdus/ha-ai-workspace/main/docker-compose.runtime.yml
#   # set CURSOR_API_KEY below (https://cursor.com/dashboard/integrations)
#   docker compose up -d
#
# Home Assistant → Runtime URL: http://127.0.0.1:8090
# 8090 is published on loopback only (not the LAN).
# Bridge network so Synology Container Manager can stop and start this container.

name: ai-workspace-runtime

services:
  cursor-sdk:
    container_name: cursor-sdk
    image: ghcr.io/domdus/ha-ai-workspace-runtime:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      CURSOR_API_KEY: "paste-your-cursor-api-key"
      CURSOR_MODEL: composer-2.5
      AUTH_MODE: ingress
      DATA_DIR: /data
      HOST: "0.0.0.0"
      PORT: "8090"
      REWRITE_LOOPBACK_HOST: host.docker.internal
    volumes:
      - ai-workspace-data:/data
    restart: unless-stopped

volumes:
  ai-workspace-data:
