# AI Workspace — copy into configuration.yaml (or a package).
# Restart Home Assistant after changes. Keys you omit keep the UI value
# (or the UI default on first import). If you include `connections:` or
# `agents:`, that list replaces the current rows of that kind.
#
# Put secrets in secrets.yaml and reference them with !secret.

ai_workspace:
  enable_sidebar: true
  enable_overlay: true
  enable_dictate: true
  allow_users: false
  house_map: false
  shorten_mcp_results: true
  change_history: true
  track_usage: true
  show_chat_usage: true
  ha_usage_sensors: false
  low_token: "off" # off | light | medium | extreme
  check_house: true
  # prompt_cache: false  # YAML only; omit to keep the default (on)
  ui_theme: standard # standard | ha_components
  cross_chat: false
  keep_chats: 30
  stt_engine: browser
  tts_engine: off
  speak_replies: false
  tts_natural: true
  system_prompt: ""
  runtime_url: ""
  runtime_token: !secret ai_workspace_runtime

  connections:
    - kind: ha_mcp # ha | ha_mcp | coolver | custom
      name: HA-MCP
      url: "" # empty = auto-detect
      token: ""
      primary: true
    - kind: custom
      name: github
      url: https://api.githubcopilot.com/mcp/
      token: !secret github_mcp

  agents:
    - id: openai
      title: OpenAI
      provider: openai # cursor | openai | anthropic | gemini | deepseek | qwen | xai | openrouter | ollama | azure | compatible
      api_key: !secret openai_api_key
      model: gpt-5
      effort: default # default | fast | high | high_fast
      assist: true
      assist_stt: true
      stt_model: gpt-4o-mini-transcribe
      assist_tts: true
      tts_model: gpt-4o-mini-tts
      tts_voice: coral
      tts_speed: 1
    - id: gemini
      title: Gemini
      provider: gemini
      api_key: !secret gemini_api_key
      model: gemini-3.8-flash
      assist: false
      assist_stt: true
      stt_model: gemini-3.8-flash
      assist_tts: true
      tts_model: gemini-3.8-flash-tts
      tts_voice: Kore
      tts_speed: 1
    - id: claude
      title: Claude
      provider: anthropic
      api_key: !secret anthropic_api_key
      model: claude-sonnet-5-5
      assist: false
    - id: ollama
      title: Ollama
      provider: ollama
      api_base: http://127.0.0.1:11434/v1
      model: llama3.2
      assist: false
    - id: azure
      title: Azure OpenAI
      provider: azure
      api_key: !secret azure_api_key
      api_base: https://YOUR-RESOURCE.openai.azure.com
      azure_api_version: "2024-10-21"
      model: gpt-4o
      assist: false
    - id: compatible
      title: LM Studio
      provider: compatible
      api_key: ""
      api_base: http://127.0.0.1:1234/v1
      model: gpt-5
      assist: false
    - id: cursor
      title: Cursor
      provider: cursor
      cursor_api_key: !secret cursor_api_key
      model: composer-2.5
      assist: false
