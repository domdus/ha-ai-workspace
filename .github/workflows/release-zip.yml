name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack integration
        run: |
          mkdir -p dist
          # HACS extractall()s this zip into custom_components/ai_workspace/,
          # so manifest.json must sit at the archive root — not ai_workspace/manifest.json.
          (cd custom_components/ai_workspace && zip -r ../../dist/ai_workspace.zip . -x '*.pyc' -x '*__pycache__*')
          unzip -l dist/ai_workspace.zip | grep -q ' manifest.json$' \
            || { echo "manifest.json is not at the root of the archive"; exit 1; }

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/ai_workspace.zip --clobber
